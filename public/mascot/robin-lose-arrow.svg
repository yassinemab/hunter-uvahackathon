<svg xmlns="http://www.w3.org/2000/svg" class="mh-scene" viewBox="0 0 900 550" role="img" aria-label="Robin de vos met pijl en boog"><style>
.robin-outline{stroke:#2c4235;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.fine{stroke-width:3}
.environment{display:none}.fox-motion{animation:breathe 3s ease-in-out infinite}.tail{transform-origin:135px 282px;animation:tail 3s ease-in-out infinite}.eye-left,.eye-right{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes tail{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,80%,85%,100%{transform:scaleY(1)}82%{transform:scaleY(.1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.broken-arrow{animation:show-break 3s infinite;transform:rotate(-12deg)}.shard-left{animation:fall-left 3s infinite}.shard-right{animation:fall-right 3s infinite}.crack{animation:crack 3s infinite}.smile{animation:hide-smile 3s infinite}.worry{animation:worried 3s infinite}
@keyframes show-break{0%,100%{opacity:0}8%,73%{opacity:1}90%{opacity:0}}
@keyframes fall-left{0%,22%{transform:translate(0,0) rotate(0)}30%{transform:translate(-7px,10px) rotate(-13deg)}48%{transform:translate(-24px,100px) rotate(-45deg)}65%,100%{transform:translate(-35px,245px) rotate(-65deg)}}
@keyframes fall-right{0%,22%{transform:translate(0,0) rotate(0)}30%{transform:translate(10px,9px) rotate(17deg)}48%{transform:translate(32px,90px) rotate(55deg)}65%,100%{transform:translate(48px,233px) rotate(85deg)}}
@keyframes crack{0%,20%,33%,100%{opacity:0}22%,30%{opacity:1}}
@keyframes hide-smile{0%,22%,100%{opacity:1}30%,90%{opacity:0}}
@keyframes worried{0%,22%,100%{opacity:0}30%,90%{opacity:1}}</style><defs><radialGradient id="glow-export"><stop stop-color="#f6f6d8" stop-opacity=".9"/><stop offset="1" stop-color="#f6f6d8" stop-opacity="0"/></radialGradient></defs>
